<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 980" width="1320" height="980" style="background:#0F172A; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9900"/>
      <stop offset="100%" stop-color="#EC7211"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#7E22CE"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <!-- Marker Arrows -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38BDF8"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#FF9900"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34D399"/>
    </marker>
  </defs>

  <!-- Title Banner -->
  <rect x="30" y="20" width="1260" height="70" rx="12" fill="url(#headerGrad)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="50" y="52" fill="#F8FAFC" font-size="22" font-weight="700" letter-spacing="0.5">ApleShahar - Live AWS Cloud Architecture</text>
  <text x="50" y="74" fill="#94A3B8" font-size="13">Region: ap-south-1 (Mumbai) | Monorepo Migration from Supabase to AWS Native Infrastructure</text>
  <rect x="1100" y="38" width="170" height="32" rx="6" fill="#1E293B" stroke="#059669" stroke-width="1.5"/>
  <text x="1185" y="58" fill="#34D399" font-size="11" font-weight="600" text-anchor="middle">STATUS: 100% LIVE</text>

  <!-- USER / CLIENT BOX -->
  <g id="userNode">
    <rect x="490" y="110" width="340" height="54" rx="10" fill="url(#cardGrad)" stroke="#64748B" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="660" y="134" fill="#F8FAFC" font-size="14" font-weight="700" text-anchor="middle">Citizen / Municipal Authority Client</text>
    <text x="660" y="151" fill="#94A3B8" font-size="11" text-anchor="middle">Web Browser (Desktop / Mobile)</text>
  </g>

  <!-- EDGE LAYER / CLOUDFRONT -->
  <g id="cloudFrontNode">
    <rect x="370" y="195" width="580" height="78" rx="12" fill="url(#cardGrad)" stroke="#FF9900" stroke-width="2" filter="url(#shadow)"/>
    <rect x="385" y="208" width="90" height="22" rx="4" fill="url(#orangeGrad)"/>
    <text x="430" y="223" fill="#0F172A" font-size="10" font-weight="800" text-anchor="middle">CLOUDFRONT</text>
    <text x="485" y="224" fill="#F8FAFC" font-size="15" font-weight="700">Amazon CloudFront CDN (Unified HTTPS Edge)</text>
    <text x="385" y="246" fill="#38BDF8" font-size="12" font-weight="600">Distribution: d1gbzyhd2sdjfm.cloudfront.net</text>
    <text x="385" y="262" fill="#94A3B8" font-size="11">Multi-Origin Reverse Proxy | Mumbai Edge PoP | Free SSL Termination | SPA Fallback</text>
  </g>

  <!-- CUSTOM VPC CONTAINER -->
  <rect x="30" y="300" width="730" height="475" rx="14" fill="#0B132B" stroke="#1D4ED8" stroke-width="2" stroke-dasharray="6,4" filter="url(#shadow)"/>
  <rect x="45" y="312" width="700" height="26" rx="4" fill="#1E293B"/>
  <text x="55" y="329" fill="#60A5FA" font-size="12" font-weight="700">Custom Amazon VPC: vpc-0004b4f628adae8df (CIDR: 10.0.0.0/16)</text>

  <!-- Internet Gateway -->
  <rect x="50" y="350" width="170" height="52" rx="8" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="135" y="372" fill="#F8FAFC" font-size="12" font-weight="600" text-anchor="middle">Internet Gateway</text>
  <text x="135" y="388" fill="#94A3B8" font-size="10" text-anchor="middle">apleshahar-igw</text>

  <!-- Public Subnet -->
  <rect x="235" y="350" width="510" height="155" rx="10" fill="#062817" stroke="#059669" stroke-width="1.5"/>
  <text x="250" y="370" fill="#34D399" font-size="12" font-weight="700">Public Subnet: apleshahar-public-1a (10.0.1.0/24 | ap-south-1a)</text>

  <!-- EC2 Security Group & Instance -->
  <rect x="250" y="382" width="480" height="110" rx="8" fill="url(#cardGrad)" stroke="#FF9900" stroke-width="1.5"/>
  <rect x="262" y="394" width="60" height="20" rx="3" fill="url(#orangeGrad)"/>
  <text x="292" y="408" fill="#0F172A" font-size="10" font-weight="800" text-anchor="middle">EC2</text>
  <text x="330" y="409" fill="#F8FAFC" font-size="13" font-weight="700">Amazon EC2 (apleshahar-backend-server | i-0260cf2d7f71c8832)</text>
  <text x="262" y="430" fill="#94A3B8" font-size="11">Instance: t3.micro (2 vCPU, 1 GB) | Public IP: 3.110.87.195 | Security Group: sg-062252861b7de2668</text>
  <text x="262" y="448" fill="#38BDF8" font-size="11">Container: apleshahar-backend (Node.js 20 / Express API on Docker Port 5000)</text>
  <text x="262" y="466" fill="#A855F7" font-size="11">IAM Instance Profile: ApleShahar-EC2-BackendRole (IMDSv2 Zero-Credential Security)</text>
  <text x="262" y="482" fill="#34D399" font-size="10">Features: Connection Pooling, Native JWT, /api/health endpoint, Decoupled raw SQL</text>

  <!-- Private Subnets / DB Tier -->
  <rect x="50" y="520" width="695" height="240" rx="10" fill="#081E38" stroke="#0284C7" stroke-width="1.5"/>
  <text x="65" y="540" fill="#38BDF8" font-size="12" font-weight="700">Private Subnets (Isolated Managed Database Tier | No Public Routes)</text>
  <text x="65" y="556" fill="#94A3B8" font-size="10">Subnet 1: apleshahar-private-1a (10.0.2.0/24) | Subnet 2: apleshahar-private-1b (10.0.3.0/24)</text>

  <!-- RDS PostgreSQL Box -->
  <rect x="65" y="570" width="665" height="175" rx="8" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1.5"/>
  <rect x="80" y="582" width="60" height="20" rx="3" fill="url(#blueGrad)"/>
  <text x="110" y="596" fill="#0F172A" font-size="10" font-weight="800" text-anchor="middle">RDS</text>
  <text x="148" y="597" fill="#F8FAFC" font-size="13" font-weight="700">Amazon RDS PostgreSQL 16.10 (apleshahar-postgres)</text>
  <text x="80" y="618" fill="#94A3B8" font-size="11">Endpoint: apleshahar-postgres.claiyoqcgr10.ap-south-1.rds.amazonaws.com:5432</text>
  <text x="80" y="636" fill="#EF4444" font-size="11">Publicly Accessible: NO | Enforced SSL Mode | Storage: 20 GB gp3 SSD (db.t3.micro)</text>
  <text x="80" y="654" fill="#38BDF8" font-size="11">Security Group: apleshahar-rds-sg (Port 5432 ingress permitted ONLY from EC2 Security Group)</text>
  <text x="80" y="674" fill="#F8FAFC" font-size="11" font-weight="600">Auto-Initialized Relational Schemas &amp; Indexes:</text>
  <text x="95" y="694" fill="#34D399" font-size="10">- users (id, email, password_hash, role, ward_no, contact)</text>
  <text x="95" y="710" fill="#34D399" font-size="10">- complaints (id, citizen_id, prob_description, image_link, ward, status, resolved_at)</text>
  <text x="95" y="726" fill="#34D399" font-size="10">- facility_requests (id, citizen_id, facility_type, request_reason, status)</text>

  <!-- STORAGE, SERVERLESS & MESSAGING CONTAINER -->
  <rect x="780" y="300" width="510" height="475" rx="14" fill="#0B132B" stroke="#64748B" stroke-width="2" stroke-dasharray="6,4" filter="url(#shadow)"/>
  <rect x="795" y="312" width="480" height="26" rx="4" fill="#1E293B"/>
  <text x="805" y="329" fill="#94A3B8" font-size="12" font-weight="700">Storage, Serverless Processing &amp; Messaging</text>

  <!-- S3 Frontend Bucket -->
  <rect x="795" y="350" width="480" height="72" rx="8" fill="url(#cardGrad)" stroke="#059669" stroke-width="1.5"/>
  <rect x="808" y="362" width="45" height="18" rx="3" fill="url(#greenGrad)"/>
  <text x="830" y="375" fill="#0F172A" font-size="9" font-weight="800" text-anchor="middle">S3</text>
  <text x="860" y="376" fill="#F8FAFC" font-size="12" font-weight="700">S3 Frontend Hosting Bucket</text>
  <text x="808" y="396" fill="#94A3B8" font-size="11">Bucket: apleshahar-frontend-852227600998-2026 (Static Website Enabled)</text>
  <text x="808" y="412" fill="#34D399" font-size="10">Hosts compiled React 19 / Vite Single Page Application | Index &amp; Error: index.html</text>

  <!-- S3 Media Bucket -->
  <rect x="795" y="432" width="480" height="85" rx="8" fill="url(#cardGrad)" stroke="#059669" stroke-width="1.5"/>
  <rect x="808" y="444" width="45" height="18" rx="3" fill="url(#greenGrad)"/>
  <text x="830" y="457" fill="#0F172A" font-size="9" font-weight="800" text-anchor="middle">S3</text>
  <text x="860" y="458" fill="#F8FAFC" font-size="12" font-weight="700">S3 Media Storage Bucket</text>
  <text x="808" y="478" fill="#94A3B8" font-size="11">Bucket: apleshahar-media-76343 (Public read policy, CORS enabled)</text>
  <text x="808" y="494" fill="#38BDF8" font-size="10">Stores citizen original photos (complaints/*) &amp; thumbnails (complaints/thumb-*)</text>
  <text x="808" y="508" fill="#A855F7" font-size="10">Event: s3:ObjectCreated:* automatically triggers AWS Lambda Image Resizer</text>

  <!-- AWS Lambda -->
  <rect x="795" y="527" width="480" height="85" rx="8" fill="url(#cardGrad)" stroke="#FF9900" stroke-width="1.5"/>
  <rect x="808" y="539" width="60" height="18" rx="3" fill="url(#orangeGrad)"/>
  <text x="838" y="552" fill="#0F172A" font-size="9" font-weight="800" text-anchor="middle">LAMBDA</text>
  <text x="875" y="553" fill="#F8FAFC" font-size="12" font-weight="700">AWS Lambda (Capability 1: Serverless Image Resizer)</text>
  <text x="808" y="573" fill="#94A3B8" font-size="11">Function: ApleShahar-ImageResizer (Node.js 20.x | 512 MB | Timeout: 30s)</text>
  <text x="808" y="589" fill="#34D399" font-size="10">Sharp optimization pipeline: Downsamples high-res photos by ~82% into thumb-*</text>
  <text x="808" y="603" fill="#94A3B8" font-size="10">Recursion Guard: Exits immediately on thumb-* to eliminate execution loops</text>

  <!-- Amazon SNS -->
  <rect x="795" y="622" width="480" height="75" rx="8" fill="url(#cardGrad)" stroke="#EF4444" stroke-width="1.5"/>
  <rect x="808" y="634" width="45" height="18" rx="3" fill="#EF4444"/>
  <text x="830" y="647" fill="#FFFFFF" font-size="9" font-weight="800" text-anchor="middle">SNS</text>
  <text x="860" y="648" fill="#F8FAFC" font-size="12" font-weight="700">Amazon SNS (Capability 2: Decoupled Alerts)</text>
  <text x="808" y="668" fill="#94A3B8" font-size="11">Topic: apleshahar-complaint-alerts (Publish/Subscribe Decoupling)</text>
  <text x="808" y="684" fill="#38BDF8" font-size="10">Subscriber: apatade76@gmail.com (Email delivery on complaint &amp; resolution)</text>

  <!-- Email Target -->
  <rect x="795" y="707" width="480" height="55" rx="8" fill="url(#cardGrad)" stroke="#64748B" stroke-width="1.5"/>
  <text x="808" y="728" fill="#F8FAFC" font-size="12" font-weight="600">Notification Recipients (Ward Officers &amp; Citizens)</text>
  <text x="808" y="746" fill="#34D399" font-size="11">Instant transactional email delivery: [ApleShahar Alert] New Issue in Ward ...</text>

  <!-- BOTTOM BAR: SECURITY, SECRETS & MONITORING -->
  <rect x="30" y="790" width="1260" height="165" rx="14" fill="#0B132B" stroke="#64748B" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="45" y="802" width="1230" height="24" rx="4" fill="#1E293B"/>
  <text x="55" y="818" fill="#94A3B8" font-size="12" font-weight="700">Management, Secrets, Security &amp; Observability</text>

  <!-- SSM Parameter Store Card -->
  <rect x="50" y="836" width="390" height="105" rx="8" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="65" y="858" fill="#38BDF8" font-size="12" font-weight="700">AWS SSM Parameter Store</text>
  <text x="65" y="876" fill="#94A3B8" font-size="10">Path: /apleshahar/* (11 Managed Parameters)</text>
  <text x="65" y="894" fill="#34D399" font-size="10">SecureString (KMS): db_password, jwt_secret</text>
  <text x="65" y="910" fill="#94A3B8" font-size="10">String: db_host, db_name, db_user, sns_topic_arn</text>
  <text x="65" y="926" fill="#F8FAFC" font-size="10" font-weight="600">Runtime injection via IAM: Zero secrets on disk</text>

  <!-- CloudWatch Card -->
  <rect x="465" y="836" width="390" height="105" rx="8" fill="url(#cardGrad)" stroke="#EF4444" stroke-width="1.5"/>
  <text x="480" y="858" fill="#EF4444" font-size="12" font-weight="700">Amazon CloudWatch</text>
  <text x="480" y="876" fill="#94A3B8" font-size="10">Alarm: EC2-HighCPU-Alarm (Metric: CPU &gt; 75% for 5 min)</text>
  <text x="480" y="894" fill="#34D399" font-size="10">Action: Automatically publishes alarm state to Amazon SNS</text>
  <text x="480" y="910" fill="#94A3B8" font-size="10">Logs: /aws/lambda/ApleShahar-ImageResizer telemetry</text>
  <text x="480" y="926" fill="#F8FAFC" font-size="10" font-weight="600">Real-time health monitoring and automated alerts</text>

  <!-- IAM Card -->
  <rect x="880" y="836" width="395" height="105" rx="8" fill="url(#cardGrad)" stroke="#A855F7" stroke-width="1.5"/>
  <text x="895" y="858" fill="#A855F7" font-size="12" font-weight="700">AWS IAM (Least Privilege)</text>
  <text x="895" y="876" fill="#94A3B8" font-size="10">Role: ApleShahar-EC2-BackendRole (IMDSv2 Instance Profile)</text>
  <text x="895" y="894" fill="#34D399" font-size="10">Scoped: S3 read/write, SNS publish, SSM /apleshahar/*</text>
  <text x="895" y="910" fill="#94A3B8" font-size="10">Role: ApleShahar-LambdaExecutionRole (Logs &amp; S3 read/write)</text>
  <text x="895" y="926" fill="#F8FAFC" font-size="10" font-weight="600">Group: Developers (arlen, hansy team accounts)</text>

  <!-- CONNECTING ARROWS & LABELS -->
  <!-- User to CloudFront -->
  <line x1="660" y1="164" x2="660" y2="192" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="670" y="182" fill="#38BDF8" font-size="10" font-weight="600">HTTPS (443)</text>

  <!-- CloudFront to S3 Frontend -->
  <path d="M 950 220 L 1030 220 L 1030 348" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="960" y="212" fill="#34D399" font-size="10" font-weight="600">Default (*) SPA Web Assets</text>

  <!-- CloudFront to IGW (API) -->
  <path d="M 370 240 L 135 240 L 135 348" fill="none" stroke="#FF9900" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <text x="145" y="232" fill="#FF9900" font-size="10" font-weight="600">/api/* Dynamic Pass-Through</text>

  <!-- IGW to EC2 -->
  <line x1="220" y1="376" x2="248" y2="376" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- CloudFront to S3 Media -->
  <path d="M 950 245 L 1260 245 L 1260 450 L 1275 450" fill="none" stroke="#38BDF8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="960" y="240" fill="#38BDF8" font-size="10" font-weight="600">/complaints/* Edge Cached</text>

  <!-- EC2 to RDS -->
  <line x1="490" y1="492" x2="490" y2="568" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="500" y="535" fill="#38BDF8" font-size="10" font-weight="700">Port 5432 (SSL Enforced)</text>

  <!-- EC2 to S3 Media -->
  <path d="M 730 455 L 793 455" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="735" y="445" fill="#34D399" font-size="9" font-weight="600">PutObject</text>

  <!-- S3 Media to Lambda -->
  <path d="M 1035 517 L 1035 525" fill="none" stroke="#FF9900" stroke-width="2" marker-end="url(#arrowOrange)"/>

  <!-- Lambda to S3 Media (Thumb) -->
  <path d="M 1080 527 L 1080 520" fill="none" stroke="#34D399" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <!-- EC2 to SNS -->
  <path d="M 730 475 L 760 475 L 760 655 L 793 655" fill="none" stroke="#EF4444" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="735" y="645" fill="#EF4444" font-size="9" font-weight="600">Publish Alert</text>

  <!-- SNS to Email -->
  <line x1="1035" y1="697" x2="1035" y2="705" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- CloudWatch to SNS -->
  <path d="M 660 836 L 660 760 L 800 760 L 800 697" fill="none" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="670" y="775" fill="#EF4444" font-size="9">Alarm Action</text>

</svg>
